networks:
  chant-shared-network:
    driver: bridge

services:
  chat-service:
    build:
      context: .
      dockerfile: ./services/chat_service/Dockerfile
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CHAT_GROUP_ID: ${CHAT_GROUP_ID:-chat-prod}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      AUTH_GRPC_ADDR: ${AUTH_GRPC_ADDR}
      AI_USER_ID: ${AI_USER_ID:-ai-assistant}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      SERVER_PORT: "8080"
      TZ: Asia/Shanghai
    networks:
      - chant-shared-network
