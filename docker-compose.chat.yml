networks:
  chant-shared-network:
    driver: bridge

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orchestrator
      POSTGRES_MULTIPLE_DATABASES: "orchestrator,ai_audit"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - chant-shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-chat:
    image: docker.m.daocloud.io/library/mongo:6
    container_name: mongodb-chat
    restart: unless-stopped
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_CHAT_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CHAT_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mongodb_chat_data:/data/db
    networks:
      - chant-shared-network

  chat-service:
    build:
      context: .
      dockerfile: ./services/chat_service/Dockerfile
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CHAT_GROUP_ID: ${CHAT_GROUP_ID:-chat-prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_NAME: orchestrator
      MONGODB_HOST: mongodb-chat
      MONGODB_PORT: "27017"
      MONGODB_DB_NAME: chat
      MONGO_USERNAME: ${MONGO_CHAT_ROOT_USERNAME:-root}
      MONGO_PASSWORD: ${MONGO_CHAT_ROOT_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_GRPC_ADDR: ${AUTH_GRPC_ADDR}
      LAST_OFFLINE_GRPC_ADDR: ${LAST_OFFLINE_GRPC_ADDR}
      SERVER_PORT: "8080"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      mongodb-chat:
        condition: service_started
    networks:
      - chant-shared-network

volumes:
  postgres_data:
  mongodb_chat_data:
