networks:
  chant-shared-network:
    driver: bridge

services:
  zookeeper:
    image: docker.m.daocloud.io/wurstmeister/zookeeper
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - chant-shared-network

  kafka:
    image: docker.m.daocloud.io/wurstmeister/kafka
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9094:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      TZ: Asia/Shanghai
    depends_on:
      - zookeeper
    networks:
      - chant-shared-network

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - chant-shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-auth:
    image: docker.m.daocloud.io/library/mongo:6
    container_name: mongodb-auth
    restart: unless-stopped
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_AUTH_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_AUTH_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mongodb_auth_data:/data/db
    networks:
      - chant-shared-network

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth_service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "50052:50052"
    environment:
      MONGODB_URL: mongodb://${MONGO_AUTH_ROOT_USERNAME:-root}:${MONGO_AUTH_ROOT_PASSWORD}@mongodb-auth:27017
      DATABASE_NAME: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:-}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HOST: 0.0.0.0
      PORT: 9030
      DEBUG: ${AUTH_SERVICE_DEBUG:-false}
      TZ: Asia/Shanghai
    depends_on:
      mongodb-auth:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - chant-shared-network

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./.deploy/nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
    networks:
      - chant-shared-network

volumes:
  redis_data:
  mongodb_auth_data:
