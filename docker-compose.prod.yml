networks:
  chant-shared-network:
    driver: bridge

services:
  # ==================== 基础设施 ====================
  zookeeper:
    image: docker.m.daocloud.io/wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - chant-shared-network
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_ZOOKEEPER:-256m}
          cpus: ${CPU_LIMIT_ZOOKEEPER:-0.2}
    restart: always

  kafka:
    image: docker.m.daocloud.io/wurstmeister/kafka
    container_name: kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    networks:
      - chant-shared-network
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_KAFKA:-1024m}
          cpus: ${CPU_LIMIT_KAFKA:-1.0}
    restart: always

  kafka-ui:
    image: docker.m.daocloud.io/provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - chant-shared-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.2
    restart: always

  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator}
      POSTGRES_MULTIPLE_DATABASES: "orchestrator,user_service"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - chant-shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_POSTGRES:-512m}
          cpus: ${CPU_LIMIT_POSTGRES:-0.5}
    restart: always

  mongodb:
    image: docker.m.daocloud.io/library/mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - mongodb_data:/data/db
    networks:
      - chant-shared-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_MONGODB:-512m}
          cpus: ${CPU_LIMIT_MONGODB:-0.5}
    restart: always

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - chant-shared-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_REDIS:-256m}
          cpus: ${CPU_LIMIT_REDIS:-0.2}
    restart: always

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - chant-shared-network
    restart: always

  searxng:
    image: docker.m.daocloud.io/searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - searxng_data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - chant-shared-network
    restart: always

  # ==================== 应用服务 ====================
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth_service/Dockerfile
    container_name: auth-service
    ports:
      - "9030:9030"
      - "50051:50051"
      - "50052:50052"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CLIENT_ID: auth-service
      KAFKA_TOPIC_SAGA_EVENTS: saga-events
      KAFKA_TOPIC_USER_REGISTERED: user-registrations
      KAFKA_TOPIC_USER_UPDATED: user-updates
      KAFKA_TOPIC_SYNC_USER_FIELDS: sync_user_fields
      HOST: 0.0.0.0
      PORT: 9030
      DEBUG: ${AUTH_SERVICE_DEBUG:-false}
      TZ: Asia/Shanghai
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chant-shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9030/api/v1/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_AUTH_SERVICE:-512m}
          cpus: ${CPU_LIMIT_AUTH_SERVICE:-0.5}
    restart: always

  chat-service:
    build:
      context: .
      dockerfile: ./services/chat_service/Dockerfile
    container_name: chat-service
    ports:
      - "8080:8080"
    environment:
      CHAT_GROUP_ID: chat-prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB_NAME: orchestrator
      MONGODB_HOST: mongodb
      MONGODB_PORT: "27017"
      MONGODB_DB_NAME: chat
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTH_GRPC_ADDR: auth-service:50051
      LAST_OFFLINE_GRPC_ADDR: auth-service:50052
      SERVER_PORT: "8080"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - chant-shared-network
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_CHAT_SERVICE:-512m}
          cpus: ${CPU_LIMIT_CHAT_SERVICE:-0.5}
    restart: always

  ai-service:
    build:
      context: ./services/ai_service
      dockerfile: Dockerfile
    container_name: ai-service
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: chat_group_message
      KAFKA_GROUP_ID: ai_service_group
      CHAT_SERVICE_URL: http://chat-service:8080
      QDRANT_URL: http://qdrant:6333
      SEARXNG_BASE_URL: http://searxng:8080
      COST_DB_HOST: postgres
      COST_DB_PORT: "5432"
      COST_DB_USER: ${POSTGRES_USER:-postgres}
      COST_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      COST_DB_NAME: ai_audit
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_USER_ID: ai-assistant
      AI_RESEARCH_USER_ID: ai-research
      SILICONFLOW_EMBEDDING_API_KEY: ${SILICONFLOW_EMBEDDING_API_KEY:-}
      SILICONFLOW_RERANKER_API_KEY: ${SILICONFLOW_RERANKER_API_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      TZ: Asia/Shanghai
    depends_on:
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
      searxng:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - chant-shared-network
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_AI_SERVICE:-512m}
          cpus: ${CPU_LIMIT_AI_SERVICE:-0.5}
    restart: always

  orchestrator-service:
    build:
      context: ./services/orchestrator_service
      dockerfile: Dockerfile
    container_name: orchestrator-service
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: orchestrator-group
      KAFKA_TOPIC: saga-events
      KAFKA_CLIENT_ID: orchestrator-service
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: orchestrator
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Asia/Shanghai
      SERVER_PORT: "8080"
      SERVER_NAME: orchestrator-service
      DEFAULT_TIMEOUT: 30s
      DEFAULT_RETRY_COUNT: 3
      COMPENSATION_TIMEOUT: 15s
      SNOWFLAKE_NODE_ID: 1
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - chant-shared-network
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT_ORCHESTRATOR_SERVICE:-512m}
          cpus: ${CPU_LIMIT_ORCHESTRATOR_SERVICE:-0.5}
    restart: always

volumes:
  searxng_data:
  postgres_data:
  qdrant_data:
  mongodb_data:
  redis_data:
