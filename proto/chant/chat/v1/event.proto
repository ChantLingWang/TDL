syntax = "proto3";

package chant.chat.v1;

option go_package = "github.com/chant/chant/gen/go/chant/chat/v1;chatv1";

// MessageSent 用户向 AI 发送了一条消息。
// 生产者: gateway(chat_service)
// 消费者: ai_service
message MessageSent {
  string sender_id = 1;
  // AI 用户 ID，如 "ai-assistant"
  string target_user_id = 2;
  // AI 会话 ID，由 gateway 生成的 UUID
  string conversation_id = 3;
  string content = 4;
  string message_id = 5;
  // text / image / file 等
  string message_type = 6;

  // 7/8 曾是 timestamp_ms / metadata，未使用，保留字段号
  reserved 7, 8;
  reserved "timestamp_ms", "metadata";

  // 第几轮，由 gateway 分配
  int64 round = 9;
}

// AiTurnStep AI 处理过程中的一步。
// 生产者: ai_service
// 消费者: gateway（WS 推送）、storage（后续按 step 落库）
//
// kind 取值：
//   "THINK"        思考
//   "TOOL_CALL"    工具调用（一批算一步，没有 status）
//   "TOOL_RESULT"  工具返回（一批算一步，每个工具带 status / duration）
//   "RESULT"       最终回答 + 本轮终止状态
message AiTurnStep {
  string sender_id = 1;
  string target_user_id = 2;
  string conversation_id = 3;
  // 回复的是哪条用户消息
  string reply_to_msg_id = 4;
  // 最终回复 ID（ai-<用户消息ID>）
  string message_id = 5;
  int64 round = 6;
  // 步号，轮内从 1 递增
  int64 step = 7;
  // 重试次数，默认 0
  int32 attempt = 8;
  string kind = 9;
  // 该步的 JSON
  string payload = 10;
}

// AiReplyGenerated AI 生成了一条完整回复。
// 生产者: ai_service
// 消费者: gateway（WS 推送）、storage（按 delta/final 落库）
message AiReplyGenerated {
  // AI 用户 ID，如 "ai-assistant"
  string sender_id = 1;
  // 回复的目标用户
  string target_user_id = 2;
  // AI 会话 ID，与 MessageSent.conversation_id 一致
  string conversation_id = 3;
  string content = 4;
  // 回复的是哪条用户消息
  string reply_to_msg_id = 5;
  string message_id = 6;

  // 7 曾是 timestamp_ms，未使用，保留字段号
  reserved 7;
  reserved "timestamp_ms";

  // 可扩展元数据（当前只用 reasoning 存思考全文）
  map<string, string> metadata = 8;
}

// AiReplyDelta AI 回复的流式增量分块。
// 生产者: ai_service
// 消费者: gateway（WS 推送）、storage（直接按该结构落库）
//
// 一条回复对应一个固定的 message_id（流开始即确定，与最终
// AiReplyGenerated 的 message_id 一致），分块按 seq 从 0 递增；
// 前端按 (message_id, seq) 累积排序，收到最终整块消息时以服务端为准。
//
// kind 取值：
//   "thinking"  思考链文本增量
//   "progress"  阶段进度文字
//   "content"   正文文本增量
//   "done"      流结束标记（content 为空，之后必有最终 AiReplyGenerated）
message AiReplyDelta {
  // AI 用户 ID，如 "ai-assistant"
  string sender_id = 1;
  // 回复的目标用户
  string target_user_id = 2;
  // AI 会话 ID，与 MessageSent.conversation_id 一致
  string conversation_id = 3;
  // 回复的是哪条用户消息
  string reply_to_msg_id = 4;
  // 最终回复的消息 ID（该回复的所有分块一致）
  string message_id = 5;
  // 分块序号，从 0 递增，前端据此排序
  int64 seq = 6;
  // thinking / progress / content / done
  string kind = 7;
  // 增量文本；kind=done 时为空
  string content = 8;

  // 9/10 曾是 timestamp_ms / metadata，未使用，保留字段号
  reserved 9, 10;
  reserved "timestamp_ms", "metadata";
}
